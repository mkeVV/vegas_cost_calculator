<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vDC Cost Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
}

input {
    width: 120px;
    padding: 6px;
    font-size: 14px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}

table {
    margin-top: 25px;
    border-collapse: collapse;
    min-width: 800px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
}

th {
    background-color: #f2f2f2;
}

.total {
    font-weight: bold;
    background-color: #f8f8f8;
}

.number {
    text-align: right;
}
</style>

</head>
<body>

<h2>vDC Cost Calculator</h2>

<label for="cpu">Virtual CPUs [CORE]</label>
<input type="number" id="cpu" value="4" min="0">

<label for="memory">Memory [GB]</label>
<input type="number" id="memory" value="16" min="0">

<label for="storage">Storage [GB]</label>
<input type="number" id="storage" value="150" min="0">

<br>
<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<script>

function eur(value) {
    return value.toFixed(2).replace('.', ',') + '€';
}

function calculate() {

    const cpu = Number(document.getElementById("cpu").value);
    const memory = Number(document.getElementById("memory").value);
    const storage = Number(document.getElementById("storage").value);

    const basicUnits = 1;

    const basicPrice = 0.5333;
    const cpuPrice = 0.5333;
    const memoryPrice = 0.1333;
    const storagePrice = 0.0036;

    const basicDay = basicUnits * basicPrice;
    const cpuDay = cpu * cpuPrice;
    const memoryDay = memory * memoryPrice;
    const storageDay = storage * storagePrice;

    const totalDay =
        basicDay +
        cpuDay +
        memoryDay +
        storageDay;

    const totalMonth = totalDay * 30;

    document.getElementById("result").innerHTML = `
        <table>
            <tr>
                <th>Description</th>
                <th>Units</th>
                <th>Price per day</th>
                <th>Price per month</th>
            </tr>

            <tr>
                <td>vDC+Networking basic fee</td>
                <td class="number">1</td>
                <td class="number">${eur(basicDay)}</td>
                <td class="number">${eur(basicDay * 30)}</td>
            </tr>

            <tr>
                <td>Virtual CPUs [CORE]</td>
                <td class="number">${cpu}</td>
                <td class="number">${eur(cpuDay)}</td>
                <td class="number">${eur(cpuDay * 30)}</td>
            </tr>

            <tr>
                <td>Memory [GB]</td>
                <td class="number">${memory}</td>
                <td class="number">${eur(memoryDay)}</td>
                <td class="number">${eur(memoryDay * 30)}</td>
            </tr>

            <tr>
                <td>Storage [GB]</td>
                <td class="number">${storage}</td>
                <td class="number">${eur(storageDay)}</td>
                <td class="number">${eur(storageDay * 30)}</td>
            </tr>

            <tr class="total">
                <td>TOTAL SUM</td>
                <td></td>
                <td class="number">${eur(totalDay)}</td>
                <td class="number">${eur(totalMonth)}</td>
            </tr>
        </table>
    `;
}

calculate();

</script>

</body>
</html>
