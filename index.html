<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEGAS vDC Cost Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 10px;
    margin-bottom: 5px;
}

input[type="number"],
select {
    width: 120px;
    padding: 6px;
    font-size: 14px;
}

.radio-group {
    margin-top: 20px;
}

.radio-group label {
    display: inline;
    margin-right: 20px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}

table {
    margin-top: 25px;
    border-collapse: collapse;
    min-width: 850px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background-color: #f2f2f2;
}

.number {
    text-align: right;
}

.total {
    font-weight: bold;
    background-color: #f8f8f8;
}
</style>

</head>
<body>

<h2>vDC Cost Calculator</h2>

<label for="customerType">Pricing Model</label>
<select id="customerType">
    <option value="automation">Automation</option>
    <option value="other">Other Unit</option>
    <option value="customer">Customer/VAR</option>
</select>

<label for="cpu">Virtual CPUs [CORE]</label>
<input type="number" id="cpu" value="4" min="0">

<label for="memory">Memory [GB]</label>
<input type="number" id="memory" value="16" min="0">

<label for="storage">Storage [GB]</label>
<input type="number" id="storage" value="150" min="0">

<div class="radio-group">
    <strong>VM Power State</strong><br><br>

    <input type="radio" id="powerOn" name="powerState" checked>
    <label for="powerOn">VM Power ON</label>

    <input type="radio" id="powerOff" name="powerState">
    <label for="powerOff">VM Power OFF</label>
</div>

<button onclick="calculate()">Calculate</button>

<div id="result"></div>

<script>

function eur(value) {
    return value.toFixed(2).replace('.', ',') + ' €';
}

function calculate() {

    const enteredCpu = Number(document.getElementById("cpu").value);
    const enteredMemory = Number(document.getElementById("memory").value);
    const storage = Number(document.getElementById("storage").value);

    const customerType =
        document.getElementById("customerType").value;

    const customerTypeText =
        document.getElementById("customerType")
        .options[document.getElementById("customerType").selectedIndex]
        .text;

    const powerOff =
        document.getElementById("powerOff").checked;

    let cpu = enteredCpu;
    let memory = enteredMemory;

    if (powerOff) {
        cpu = 0;
        memory = 0;
    }

    const basicUnits = 1;

    let basicPrice;
    let cpuPrice;
    let memoryPrice;
    let storagePrice;

    switch (customerType) {

        case "automation":
            basicPrice = 0.5333;
            cpuPrice = 0.5333;
            memoryPrice = 0.1333;
            storagePrice = 0.0036;
            break;

        case "other":
            basicPrice = 0.6933;
            cpuPrice = 0.6933;
            memoryPrice = 0.1733;
            storagePrice = 0.0046;
            break;

        case "customer":
            basicPrice = 1.0667;
            cpuPrice = 1.0667;
            memoryPrice = 0.2667;
            storagePrice = 0.0071;
            break;
    }

    const basicDay = basicUnits * basicPrice;
    const cpuDay = cpu * cpuPrice;
    const memoryDay = memory * memoryPrice;
    const storageDay = storage * storagePrice;

    const totalDay =
        basicDay +
        cpuDay +
        memoryDay +
        storageDay;

    const totalMonth = totalDay * 30;

    document.getElementById("result").innerHTML = `
        <table>
            <tr>
                <th>Description</th>
                <th>Units</th>
                <th>Price per day</th>
                <th>Price per month</th>
            </tr>

            <tr>
                <td>Pricing Model</td>
                <td>${customerTypeText}</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>vDC+Networking basic fee</td>
                <td class="number">1</td>
                <td class="number">${eur(basicDay)}</td>
                <td class="number">${eur(basicDay * 30)}</td>
            </tr>

            <tr>
                <td>Virtual CPUs [CORE]</td>
                <td class="number">${powerOff ? 0 : enteredCpu}</td>
                <td class="number">${eur(cpuDay)}</td>
                <td class="number">${eur(cpuDay * 30)}</td>
            </tr>

            <tr>
                <td>Memory [GB]</td>
                <td class="number">${powerOff ? 0 : enteredMemory}</td>
                <td class="number">${eur(memoryDay)}</td>
                <td class="number">${eur(memoryDay * 30)}</td>
            </tr>

            <tr>
                <td>Storage [GB]</td>
                <td class="number">${storage}</td>
                <td class="number">${eur(storageDay)}</td>
                <td class="number">${eur(storageDay * 30)}</td>
            </tr>

            <tr class="total">
                <td>TOTAL SUM</td>
                <td></td>
                <td class="number">${eur(totalDay)}</td>
                <td class="number">${eur(totalMonth)}</td>
            </tr>
        </table>
    `;
}

calculate();

</script>

</body>
</html>
``
